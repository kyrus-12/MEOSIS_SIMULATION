<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ME-YOU-SIS Simulation</title>
    <style>
        :root{
            --bg:#fff;
            --fg:#000;
            --muted:#333;
            --panel:#fff;
            --line:#d4d4d8;
            --cell:#f7f8fc;
            --cellline:#9aa3b8;
            --nuc:#0284c7;
            color-scheme:light;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top, 0px);
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        html{
            height:100%;
            scroll-padding-top:env(safe-area-inset-top, 0px);
        }
        body{
            min-height:100%;
            margin:0;
            background:var(--bg);
            color:var(--fg);
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .app{
            display:flex;
            flex-direction:column;
            min-height:100%;
        }
        .stage{
            display:flex;
            flex-direction:column;
            flex:0 0 auto;
        }
        .steps{
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:6px;
            padding:10px 10px 6px;
        }
        .step{
            min-width:0;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--muted);
            border-radius:12px;
            padding:7px 2px; 
            font:600 clamp(10px, 2.6vw, 13px) inherit;
            font-family:inherit;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:3px;
            transition:all 0.3s;
        }
        .step i{
            width:8px;
            height:8px;
            border-radius:50%;
            background:var(--c);
            opacity:0.5;
            transition:all 0.3s;
            font-style:normal;
            display:none;
        }
        .step.on{
            color:var(--fg);
            border-color:var(--c);
            background:color-mix(in srgb, var(--c) 20%, var(--panel));
        }
        .step.on i{
            opacity:1;
            box-shadow:0 0 10px var(--c);
            transform:scale(1.4);
            display:none;
        }
        main{
            height:clamp(300px, 46vh, 540px);
            position:relative;
        }
        canvas{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            touch-action:manipulation;
        }
        .ctrl{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            align-items:center;
            gap:8px;
            padding:8px 10px 2px;
        }
        .hint{
            margin:2px 10px 10px;
            text-align:center;
            font-size:12px;
            color:var(--muted);
        }
        .btn{
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:8px 14px;
            font:inherit;
            font-size:14px;
            cursor:pointer;
        }
        .btn:active{
            transform:scale(0.96);
        }
        .btn.main{
            background:#6366f1;
            border-color:#6366f1;
            color:#fff;
        }
        .cnt{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            color:var(--muted);
        }
        .cnt .btn{
            padding:6px 11px;
        }
        .cnt input{
            width:60px;
            text-align:center;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:7px 4px;
            font:inherit;
            font-size:16px;
        }
        .box{
            padding:14px;
            border-top:1px solid var(--line);
        }
        .fhead{
            display:flex;
            align-items:baseline;
            justify-content:space-between;
            gap:10px;
        }
        #formula{
            font-weight:800;
            font-size:clamp(28px, 7vw, 38px);
            line-height:1.1;
        }
        #formula small{
            display:block;
            font-size:12px;
            font-weight:600;
            color:var(--muted);
            margin:2px;
        }
        #phname{
            font-weight:800;
            font-size:clamp(16px, 4.4vw, 20px);
        }
        #phtxt{
            font-size:13px;
            color:var(--muted);
            margin:6px 0 12px;
            line-height:1.4;
        }
        .q{
            border:1px solid var(--line);
            border-radius:12px;
            padding:8px 10px;
            margin-bottom:8px;
            background:#f4f4f5;
            transition:background 0.2s, border-color 0.2s;
        }
        .q.ok{
            border-color:green;
            background:#f0fdf4;
        }
        .q.bad{
            border-color:red;
            background:#fef2f2;
        }
        .qr{
            display:flex;
            align-items:left;
            gap:8px;
        }
        .qr label{
            flex:1;
            font-size:14px;
            line-height:1.3;
        }
        .qr input{
            width:64px;
            text-align:center;
            font:inherit;
            font-size:16px;
            font-weight:700;
            border:1px solid var(--line);
            border-radius:10px;
            padding:6px 4px;
            background:#fff;
            color:#000;
        }
        .mark{
            width:20px;
            text-align:center;
            font-weight:800;
        }
        .msg{
            display:none;
            font-size:12.5px;
            line-height:1.35;
            margin-top:6px;
        }
        .q.ok .msg{
            display:block;
            color:black;
        }
        .q.bad .msg{
            display:block;
            color:black;
        }
        #fb{
            display:flex;
            justify-content:space-between;
            gap:10px;
            font-size:14px;
            font-weight:600;
            padding:10px 12px;
            border-radius:12px;
            background:#f4f4f5;
        }
        #fb.done{
            background:#f4f4f5;
            color:black;
        }
        @media(min-width:900px){
            body{
                height:100%;
                overflow:hidden;
            }
            .app{
                flex-direction:row;
                height:100%;
            }
            .stage{
                flex:1;
                min-width:0;
            }
            main{
                flex:1;
                height:auto;
                min-height:0;
            }
            .box{
                flex:0 0 390px;
                width:390px;
                overflow:auto;
                border-top:0;
                border-left:1px solid var(--line);
            }
        }
        #bld[hidden]{
            display:none;
        }
        #bld{
            position:absolute; 
            inset:0;
            display:flex;
            gap:8px;
            padding:8px;
            background:var(--bg);
            z-index:2;
        }
        .pal{
            flex:0 0 132px;
            width:132px;
            border: 2px solid var(--line);
            border-radius:14px;
            padding:8px;
            overflow:auto;
            background:var(--panel);
        }
        .prow{
            margin-bottom:10px;
        }
        .prow b{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            margin-bottom:4px;
        }
        .pbtn{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:4px;
        }
        .pbtn .btn{
            padding:4px 10px;
        }
        .pbtn span{
            font-weight:700;
        }
        .ic{
            display:inline-block;
            width:14px;
            height:14px;
            border-radius:50%;
        }
        .ic-nuc{
            border:2px dashed var(--nuc);
        }
        .ic-cen{
            background:#fbbf24;
        }
        .ic-chr{
            background:linear-gradient(135deg, #f472b6, #38bdf8);
        }
        .phint{
            font-size:11px;
            color:var(--muted);
            margin:6px 0 0;
            line-height:1.35;
        }
        .board{
            flex:1;
            min-width:0;
            position:relative;
            border:2px dashed var(--cellline);
            border-radius:14px;
            background:#fff;
            overflow:auto;
        }
        #world{
            position:relative;
        }
        .el.nt{
            transition:none;
        }
        .el{
            position:absolute;
            z-index:2;
            touch-action:none;
            user-select:none;
            transition:left 0.9s ease, top 0.9s ease, transform 0.4s, opacity 0.5s;
        }
        .el.nuc{
            width:96px;
            height:96px;
            border:2px dashed var(--nuc);
            border-radius:50%;
            background:rgba(2, 132, 199, 0.1);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:12px;
            font-weight:700;
            color:var(--nuc);
            cursor:grab;
        }
        .el.cen{
            width:64px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:2px;
            font-size:11px;
            cursor:grab;
        }
        .el.cen i{
            width:26px;
            height:26px;
            border-radius:50%;
            background:#fbbf24;
            box-shadow:0 0 8px #fbbf24;
            position:relative;
        }
        .el.cen i::before,
        .el.cen i::after{
            content:'';
            position:absolute;
            background:#b45309;
            border-radius:4px;
        }
        .el.cen i::before{ 
            width:11px; 
            height:5px; 
            left:3px; 
            top:14px;
        }
        .el.cen i::after { 
            width:5px;
            height:11px;
            left:17px;
            top:6px;
        }
        .el.chr{
            line-height:0;
        }
        .el.chr .grip{
            cursor:grab;
            touch-action:none;
        }
        .el.chr input{
            width:80px;
            font:inherit;
            font-size:12px;
            text-align:center;
            border:1px solid var(--line);
            border-radius:8px;
            padding:3px;
            background:#fff;
            color:#000;
        }
        .el.cell{
            z-index:0;
            border:4px solid var(--cellline);
            border-radius:50%;
            background:var(--cell);
            cursor:grab;
        }
        .el.cell span{
            position:absolute;
            top:8px;
            left:0;
            right:0;
            text-align:center;
            font-size:11px;
            font-weight:700;
            color:var(--muted);
        }
        .ic-cell{
            border:3px solid var(--cellline);
        }
        .el.drag{
            transition:none;
            z-index:5;
            filter:drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }
        .q > label{
            display:block;
            font-size:14px;
            line-height:3;
        }
        .opts{
            display:flex;
            flex-direction:column;
            gap:6px;
            margin-top:6px;
        }
        .opt{
            border: 1px solid var(--line);
            background:#fff;
            color:#000;
            border-radius:10px;
            padding:6px 10px;
            font:inherit;
            font-size:15px;
            text-align:left;
            cursor:pointer;
            width:100%;
        }
        .opt.pick{
            border-color:#6366f1;
            background:#eef2ff;
            font-weight:700;
        }
        .el.cell.drag{
            z-index:0;
        }
        .el.sel{
            outline:2px dashed #6366f1;
            outline-offset:3px;
        }
        .grip{
            overflow:visible;
            transform-origin:50% 50%;
        }
        .board.playing .grip.ph1{
            animation:cond 1.4s ease-in-out infinite alternate;
        }
        .board.playing .mv.ph2{
            animation:tug 0.5s ease-in-out infinite alternate;
        }
        .board.playing .mv.ph3{
            animation:pull 2.4s ease-in-out infinite alternate;
        }
        .board.playing .grip.ph4{
            animation:wig 2.6s ease-in-out infinite;
        }
        .board.playing .grip.ph5{
            animation:cond 1.4s ease-in-out infinite alternate;
        }
        .board.playing .mv.ph6{
            animation:tug 0.5s ease-in-out infinite alternate;
        }
        .board.playing .grip.ph7{
            animation:pull 2.4s ease-in-out infinite alternate;
        }
        .board.playing .grip.ph8{
            animation:wig 2.6s ease-in-out infinite;
        }
        .board.playing .grip.ph0 .rep{
            stroke-dasharray:100;
            animation:draw 2s ease-out infinite;
        }
        @keyframes tug{
            from{ transform:translateX(-3px)} to {transform:translateX(3px)}
        }
        @keyframes pull{
            from{ transform:translateX(0px)} to {transform:translateX(calc(var(--dir, 1) * 22px))}
        }
        .board.playing .el.nuc{
            color:transparent;
        }
        .board.playing .el.cen{
            font-size:0;
        }
        .board.playing .el.cell span{
            display:none;
        }
        .board.playing .tb{
            display:none;
        }
        .board.playing .el.sel{
            outline:none;
        }
        .board.playing .el.cen i{
            animation:glow 1.2s ease-in-out infinite alternate;
        }
        @keyframes glow{
            from{ box-shadow:0 0 4px #fbbf24;} to {box-shadow:0 0 16px 4px #fbbf24}
        }
        .board.playing.p1 .el.nuc,
        .board.playing.p5 .el.nuc{
            animation:dissolve 2.4s ease-in-out forwards;
        }
        .board.playing.p4 .el.nuc,
        .board.playing.p8 .el.nuc{
            animation:form 2.4s ease-in-out infinite alternate;
        }
        .board.playing.cyto .el.nuc{
            animation:none;
            opacity:1;
            filter:none;
        }
        @keyframes dissolve{
            from{opacity:1} to {opacity:0.15}
        }
        @keyframes form{
            from{opacity:2; filter:blur(3px)} to {opacity:1; filter:none}
        }
        .board.cl .el.cell{
            border-color:transparent;
            background:transparent;
        }
        #cleave{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:0;
        }
        .mv, .rt{
            display:block;
            line-height:0;
        }
        .rt{
            transition:transform 0.3s;
        }
        #fib{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:1;
        }
        #fib line{
            stroke:#64748b;
            stroke-width:1.2;
            stroke-dasharray:5 4;
            animation:dash 0.8s linear infinite;
        }
        @keyframes dash{
            to{stroke-dashoffset:-9;}
        }
        @keyframes wig{
            0%, 100% {transform:skewX(-7deg)} 50% {transform:skewX(7deg)}
        }
        @keyframes cond{
            from{transform:scale(0.7, 1.35); opacity:0.6;} to {transform:none; opacity:1;}
        }
        @keyframes draw{
            from{ stroke-dashoffset:100;} to {stroke-dashoffset:0;}
        }
        .tb{
            position:absolute;
            z-index:6;
            display:flex;
            align-items:center;
            gap:4px;
            padding:4px 6px;
            background:#fff;
            border:1px solid var(--line);
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0, 0, 0, 0.25);
            font-size:12px;
            font-weight:600;
        }
        .tb[hidden]{
            display:none;
        }
        .tb input{
            width:96px;
            font:inherit;
            font-size:12px;
            border:1px solid var(--line);
            border-radius:8px;
            padding:3px 6px;
            color:#000;
            background:#fff;
        }
        .tb .btn{
            padding:2px 9px;
        }
        .bwrap{
            flex:1;
            min-width:0;
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .bwrap .board{
            flex:1;
            min-height:0;
        }
        .plbl{
            position:absolute;
            z-index:7;
            pointer-events:none;
            padding:3px 10px;
            border-radius: 11px;
            border:1px solid rgba(0, 0, 0, 0.25);
            font-size:12px;
            font-weight:700;
            color:#0b1020;
            white-space:nowrap;
        }
        .plbl[hidden]{
            display:none;
        }
        .hd{
            display:none;
            cursor:grab;
            touch-action:none;
        }
        .el.sel .hd{
            display:block;
        }
        .board.playing .hd{
            display:none;
        }
        #bcap{
            font-size:12px;
            font-weight:600;
            line-height:1.3;
        }
        #retry{
            display:block;
            width:auto;
            min-width:160px;
            margin:10px auto 0;
            padding:10px 24px;
            border:1px solid var(--line);
            border-radius:12px;
            background:#08519C;
            color:#fff;
            font:inherit;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            text-align:center;
        }
        #retry:active{ 
            transform:scale(0.98); 
        }
        .opt:disabled{
            cursor:default;
        }
        input:disabled{ 
            opacity:1; 
            cursor:default; 
        }
    </style>
    </head>
    <body>
        <div class="app">
            <section class="stage">
                 <div class="steps" id="steps"></div>
                  <main>
                    <canvas id="c"></canvas>
                    <div id="bld" hidden>
                        <div class="pal" id="pal"></div>
                        <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
                            <div class="board" id="board">
                                <div id="world">
                                    <svg id="cleave"></svg>
                                    <svg id="fib"></svg>
                                    <div class="tb" id="tb" hidden>
                                        <span id="tbl"></span>
                                        <input id="tbn" type="text" maxlength="14" placeholder="Name" aria-label="Chromosome Name">
                                        <button class="btn" id="tbm" title="Smaller">-</button>
                                        <span id="tbz">100%</span>
                                        <button class="btn" id="tbp" title="Larger">+</button>
                                        <button class="btn" id="tbrl" title="Rotate Left">↺</button>
                                        <button class="btn" id="tbrr" title="Rotate Right">↻</button>
                                        <button class="btn" id="tbtg" title="Random Shapes">🔄</button>
                                        <button class="btn" id="tbst" title="Straighten">|</button>
                                    </div>
                                    <div id="pLbl" hidden style="position:absolute; z-index:5; padding:2px 8px; border-radius:8px; font-size:12px; font-weight:600; color:#000; white-space:nowrap; pointer-events:none;"></div>
                                </div>
                            </div>
                            <div id="bcap"></div>
                        </div>
                    </div>
                </main>
                
                <div class="ctrl">
                     <button class="btn" id="prev">◀️</button>
                     <button class="btn" id="play">[ ▸ ]</button>
                     <button class="btn" id="next">▶️</button>
                     <button class="btn" id="build">🧬</button>
                     <span class="cnt">Chromosomes
                        <button class="btn" id="minus">-</button><input id="cnt" type="number" min="2" inputmode="numeric" aria-label="Number of Chromosomes"><button class="btn" id="plus">+</button>
                    </span>
                </div>
                <p class="hint"></p>
            </section>
            <aside class="box">
                <div class="fhead"><div id="formula"></div><div id="phname"></div></div>
                <p id="phtxt"></p>
                <div id="qs"></div>
                <div id="fb"><span id="fbm"></span><b id="score"></b></div>
                <button id="retry" type="button">Try again</button>
            </aside>
        </div>
        <script>
            const $ = s => document.querySelector(s), lerp = (a,b,k) => a+(b-a)*k;
            const PH = [
                {n: 'Interphase', c:'violet', t: ''},
                {n: 'Prophase I', c:'violet', t: ''},
                {n: 'Metaphase I', c:'violet', t: ''},
                {n: 'Anaphase I', c:'violet', t: ''},
                {n: 'Telophase I', c:'violet', t: ''},
                {n: 'Cytokinesis', c:'violet', t: ''},
                {n: 'Prophase II', c:'orange', t: ''},
                {n: 'Metaphase II', c:'orange', t: ''},
                {n: 'Anaphase II', c:'orange', t: ''},
                {n: 'Telophase II', c:'orange', t: ''},
                {n: 'Cytokinesis', c:'orange', t: ''},
            ];

            const BASE = [0, 1, 2, 3, 4, 4, 5, 6, 7, 8, 8];
            const bph = () => BASE[phase];

            let build = false;
            const THREAD_LEN = 0.35;
            const HUE = [330, 200, 265, 155, 40];
            let thr = 1, thS = 1, th2 = 0, xo = 0, N = 10, P = 5, phase = 0, sel = -1, timer = null, W = 0, H = 0, R = 100, cur = null, t = 0, last = performance.now();
            const cvs = $('#c'), ctx = cvs.getContext('2d');

            const stepsEl = $('#steps');
            PH.forEach((p, i) => { 
                const b = document.createElement('button'); 
                b.className = 'step';
                b.style.setProperty('--c', p.c);
                b.innerHTML = '<i></i>' + p.n;
                b.onclick = () => setPhase(i); 
                stepsEl.appendChild(b)
            });

            function setPhase(p){
                phase = (p + PH.length) % PH.length;
                [...stepsEl.children].forEach((b, i) => b.classList.toggle('on', i === phase));
                showFormula();
                renderQuiz();
            }

            $('#prev').onclick = () => setPhase(phase - 1);
            $('#next').onclick = () => setPhase(phase + 1);
            $('#play').onclick = () => {
                if(build){ bplay(); return}
                if(timer){
                    clearInterval(timer);
                    timer = null;
                    $('#play').textContent = '[ ▸ ]';
                } else {
                    $('#play').textContent = '❚❚';
                    timer = setInterval(() => setPhase (phase + 1), 4200);
                }
            };

            function showFormula(){
                const NN = build ? cget() : N;
                $('#formula').innerHTML = '2n = ' +NN;
            };

            function setN(v){
                v = Math.round(+v / 2) * 2;
                if(!v || v < 2) v = 2;
                N = Math.min(46, v);
                P = N / 2;
                if(sel >= N) sel = -1;
                $('#cnt').value = N;
                showFormula();
                renderQuiz();
            }

            const mq = (q, a, ok, h) => ({q, a, ok, h});
            const Q = [
                [

            function segDist(px, py, a, b){

            const view = () => ({x0 : board.scrollLeft - 150, x1 : board.scrollLeft + board.clientWidth + 150, y0 : board.scrollTop - 150, y1 : board.scrollTop + board.clientHeight + 150});

            const shapes = {};
            function initShape(seed){

            function smoothD(P){

                for(let i = 0; i < P.length - 1; i++){
                    const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], e = P[Math.min(P.length - 1, i + 2)];
                    d += 'C' + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + ' ' + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + ' ' + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + '  ' + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + ' ' + c[0].toFixed(1) + ' ' + c[1].toFixed(1);

            function redoThreads(e){

                function chrSvg(h, ph, sd, k, one){
                const L0 = (k & 1) ? 44 : 60, Lx = (k & 1) ? 60 : 40;

                const dot = (x, y) => '<circle class="cm" cx="' + x + '" cy="' + y + '" r="4.5" fill="#fde86a" stroke="#92400e" stroke-width="1.5"/>';
                const lf = !(k & 1);
                const seg = (d, w, up) => p(d, x, w, 'pathlength ="100" stroke-dasharray="28 200" stroke-dashoffset="' + (up ? -22 : -50) + '"');

                const X = p(A, a, 8) + p(B, b, 8) + (lf ? seg(B, 8, 1) + seg(A, 8, 0) : seg(A, 8, 1) + seg(B, 8, 0)) + dot(20, 30);
                const coil = p(CA, a, 6) + p(CB, b, 6) + (lf ? seg(CB, 6, 1) + seg(CA, 6, 0) : seg(CA, 6, 1) + seg(CB, 6, 0));

                    (() => {

                        const hs = (st, c) => sh[st].map((q, i) => {
                            const en = i === 0 || i === sh[st].length - 1;
                            return '<circle class="hd" data-st="' + st + '" data-i="' + i + '" cx="' + q[0] +'" cy="' + q[1] + '" r="' + (en ? 5.5 : 4) + '" fill="' + (en ? c : '#fff') + '" stroke="' + dk + '" stroke-width="1.5"/>'
                        }).join('');

             function sync(){

               function dragIt(e){

               function renderMCQ(){
                $('#phname').textContent = PH[phase].n + ' (build)';
                $('#phname').style.color = PH[phase].c;
                $('#phtxt').textContent = '';
                const box = $('#qs');
                box.innerHTML = '';
                let got = 0, tot = 0;
                MQ[phase].forEach((m, i) => {
                    const d = document.createElement('div');
                        d.className = 'q';
                        d.innerHTML = '<label>' + (i + 1) + '. ' + m.q + '</label><div class="opts"></div><div class="msg"></div>';
                        const msg = d.querySelector('.msg'), v = m.f ? m.f() : null;
                        box.appendChild(d);
                        if(m.f && !v){
                            msg.style.color = 'var(--muted)';
                            msg.textContent = 'Build first.';
                            return;
                        }
                        const opts = m.f ? numOpts(v) : m.o.slice().sort(), right = m.f ? String(v) : m.o[0], key = phase + '|' + i, pick = mans[key];
                        tot++;
                        opts.forEach(t => {
                            const b = document.createElement('button');
                            b.className = 'opt' + (t === pick ? ' pick' : '');
                            b.textContent = t;
                            if(pick !== undefined) b.disabled = true;
                            b.onclick = () => {
                                if(mans[key] !== undefined) return;
                                mans[key] = t;
                                renderMCQ();
                            };
                            d.querySelector('.opts').appendChild(b)
                        });
                        if(opts.includes(pick)){
                            const ok = pick === right;
                            if(ok) got++;
                            d.classList.add(ok ? 'ok' : 'bad');
                            msg.textContent = ok ? (m.f ? m.ok(v) : m.ok) : 'Not quite. ' + m.h;
                        }
                });
                const done = tot > 0 && got === tot;
                $('#fb').className = done ? 'done' : '';
                $('#fbm').textContent = tot === 0 ? 'Have fun building cells.' : done ? 'Phase complete! 🥳' : got + ' of ' + tot + ' correct.';
                $('#score').textContent = got + ' / ' + tot;
            }
        </script>
